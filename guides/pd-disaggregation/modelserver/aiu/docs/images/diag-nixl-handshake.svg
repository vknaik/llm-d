<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#ffffff;font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f62fe"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#007d79"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8a3ffc"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="30" y="30" font-size="18" font-weight="700" fill="#161616">NIXL Handshake &amp; Async DMA Transfer Protocol</text>
  <text x="30" y="50" font-size="12" fill="#525252">Peer-to-Peer Sequence: TCP Side-Channel Handshake → Agent Registration → UCX DMA Read → H2D Ingestion</text>

  <!-- Lifeline Columns -->
  <!-- Decode Worker Lifeline -->
  <g transform="translate(180, 80)">
    <rect x="-100" y="0" width="200" height="40" rx="6" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="0" y="20" font-size="12.5" font-weight="700" fill="#0043ce" text-anchor="middle">Decode Worker</text>
    <text x="0" y="34" font-size="10.5" fill="#525252" text-anchor="middle">PID: d_worker (Port 8001)</text>
    <line x1="0" y1="40" x2="0" y2="420" stroke="#0f62fe" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Prefill Worker Lifeline -->
  <g transform="translate(740, 80)">
    <rect x="-100" y="0" width="200" height="40" rx="6" fill="#f2f9f7" stroke="#007d79" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="0" y="20" font-size="12.5" font-weight="700" fill="#005d5d" text-anchor="middle">Prefill Worker</text>
    <text x="0" y="34" font-size="10.5" fill="#525252" text-anchor="middle">PID: p_worker (Port 8000)</text>
    <line x1="0" y1="40" x2="0" y2="420" stroke="#007d79" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- PHASE 1: HANDSHAKE & AGENT REGISTRATION -->
  <rect x="60" y="140" width="800" height="22" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
  <text x="70" y="155" font-size="11" font-weight="700" fill="#161616">Phase 1: Initial Handshake &amp; Memory Agent Registration (Once per Peer Engine)</text>

  <!-- Message 1: TCP Connect -->
  <g transform="translate(0, 180)">
    <line x1="180" y1="0" x2="735" y2="0" stroke="#0f62fe" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
    <rect x="360" y="-12" width="200" height="22" rx="3" fill="#ffffff" stroke="#0f62fe" stroke-width="0.8"/>
    <text x="460" y="3" font-size="10.5" font-weight="600" fill="#0f62fe" text-anchor="middle">TCP Connect to Port 5600</text>
  </g>

  <!-- Message 2: NixlHandshakePayload -->
  <g transform="translate(0, 220)">
    <line x1="740" y1="0" x2="185" y2="0" stroke="#007d79" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
    <rect x="330" y="-12" width="260" height="22" rx="3" fill="#ffffff" stroke="#007d79" stroke-width="0.8"/>
    <text x="460" y="3" font-size="10.5" font-weight="600" fill="#007d79" text-anchor="middle">NixlHandshakePayload (Metadata + Descs)</text>
  </g>

  <!-- Local Action: Verify & Add Agent -->
  <g transform="translate(80, 255)">
    <rect x="0" y="0" width="200" height="52" rx="4" fill="#f6f2ff" stroke="#8a3ffc" stroke-width="1"/>
    <text x="10" y="16" font-size="10" font-weight="700" fill="#6929c4">1. Verify Dimensions &amp; Strides</text>
    <text x="10" y="30" font-size="10" font-weight="700" fill="#6929c4">2. nixl_wrapper.add_remote_agent()</text>
    <text x="18" y="44" font-size="9" fill="#525252">• prep_xfer_dlist &amp; UCX Channel</text>
  </g>

  <!-- Establish UCX Channel -->
  <g transform="translate(0, 310)">
    <line x1="180" y1="0" x2="735" y2="0" stroke="#8a3ffc" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-purple)"/>
    <rect x="350" y="-12" width="220" height="22" rx="3" fill="#ffffff" stroke="#8a3ffc" stroke-width="0.8"/>
    <text x="460" y="3" font-size="10" font-weight="600" fill="#6929c4" text-anchor="middle">Establish UCX Channel (CMA / TCP)</text>
  </g>

  <!-- PHASE 2: PER-REQUEST DMA KV TRANSFER -->
  <rect x="60" y="340" width="800" height="22" rx="4" fill="#edf5ff" stroke="#a6c8ff" stroke-width="1"/>
  <text x="70" y="355" font-size="11" font-weight="700" fill="#0043ce">Phase 2: Per-Request Asynchronous KV Block Transfer (Triggered by Phase 2 HTTP Request)</text>

  <!-- Message 3: nixl_wrapper.transfer("READ") -->
  <g transform="translate(0, 385)">
    <line x1="180" y1="0" x2="735" y2="0" stroke="#0f62fe" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
    <rect x="330" y="-13" width="260" height="24" rx="3" fill="#ffffff" stroke="#0f62fe" stroke-width="1" filter="url(#shadow)"/>
    <text x="460" y="3" font-size="10.5" font-weight="700" fill="#0043ce" text-anchor="middle">nixl_wrapper.transfer("READ", block_ids)</text>
    <text x="460" y="24" font-size="9.5" fill="#525252" text-anchor="middle">(Async Zero-Copy DMA Read via UCX)</text>
  </g>

  <!-- Message 4: UCX Transfer Completed (DONE) -->
  <g transform="translate(0, 435)">
    <line x1="740" y1="0" x2="185" y2="0" stroke="#007d79" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrow-teal)"/>
    <rect x="350" y="-12" width="220" height="22" rx="3" fill="#ffffff" stroke="#007d79" stroke-width="0.8"/>
    <text x="460" y="3" font-size="10.5" font-weight="700" fill="#007d79" text-anchor="middle">UCX Transfer Completed (DONE)</text>
  </g>

  <!-- Local Action: H2D and Decode Step 1 -->
  <g transform="translate(80, 465)">
    <rect x="0" y="0" width="200" height="42" rx="4" fill="#eaf5ea" stroke="#198038" stroke-width="1"/>
    <text x="10" y="16" font-size="10.5" font-weight="700" fill="#198038">1. sync_recved_kv_to_device()</text>
    <text x="18" y="28" font-size="9" fill="#525252">H2D: Staging DRAM → Device Memory</text>
    <text x="10" y="38" font-size="10" font-weight="700" fill="#198038">2. Autoregressive Decode Step 1</text>
  </g>
</svg>
