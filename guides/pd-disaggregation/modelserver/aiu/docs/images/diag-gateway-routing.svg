<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%" style="background:#ffffff;font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f62fe"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#007d79"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8a3ffc"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#198038"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="30" y="30" font-size="18" font-weight="700" fill="#161616">Multi-Route Ingress &amp; Gateway Routing Architecture</text>
  <text x="30" y="50" font-size="12" fill="#525252">Unified OpenShift Istio Ingress Gateway with Endpoint Picker (EPP) Scheduling</text>

  <!-- External Client Box -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="180" height="70" rx="8" fill="#f4f4f4" stroke="#8d8d8d" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="28" font-size="13" font-weight="700" fill="#161616" text-anchor="middle">External Client</text>
    <text x="90" y="46" font-size="11" fill="#525252" text-anchor="middle">curl / Benchmark Suite</text>
    <text x="90" y="60" font-size="10" fill="#0f62fe" text-anchor="middle">HTTP POST /v1/...</text>
  </g>

  <!-- Arrow Client -> Gateway -->
  <path d="M 210 115 L 260 115" stroke="#0f62fe" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Istio Ingress Gateway Box -->
  <g transform="translate(265, 75)">
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#edf5ff" stroke="#0f62fe" stroke-width="2" filter="url(#shadow)"/>
    <text x="110" y="26" font-size="13" font-weight="700" fill="#0043ce" text-anchor="middle">Istio Ingress Gateway</text>
    <text x="110" y="44" font-size="11" font-weight="600" fill="#161616" text-anchor="middle">ClusterIP: 172.30.116.228:80</text>
    <text x="110" y="62" font-size="10" fill="#525252" text-anchor="middle">HTTPRoute Header Evaluation</text>
  </g>

  <!-- Arrow Gateway -> EPP -->
  <path d="M 485 115 L 535 115" stroke="#0f62fe" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Endpoint Picker (EPP) Box -->
  <g transform="translate(540, 75)">
    <rect x="0" y="0" width="340" height="80" rx="8" fill="#f6f2ff" stroke="#8a3ffc" stroke-width="2" filter="url(#shadow)"/>
    <text x="170" y="26" font-size="13" font-weight="700" fill="#6929c4" text-anchor="middle">Endpoint Picker (EPP: v0.11.0)</text>
    <text x="170" y="44" font-size="11" fill="#161616" text-anchor="middle">Global Request Scheduler &amp; Load Scorer</text>
    <text x="170" y="62" font-size="10.5" fill="#6929c4" font-weight="600" text-anchor="middle">Injects `x-prefiller-host-port` Header</text>
  </g>

  <!-- Route Branches -->
  <!-- Branch 1: /tp1/v1/completions -->
  <path d="M 710 155 L 710 195 L 340 195 L 340 220" fill="none" stroke="#007d79" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
  
  <!-- Branch 2: /v1/completions -->
  <path d="M 710 155 L 710 220" fill="none" stroke="#0f62fe" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Branch 3: /hybrid/v1/completions -->
  <path d="M 710 155 L 710 195 L 800 195 L 800 220" fill="none" stroke="#8a3ffc" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Branch 4: /gpu/v1/completions -->
  <path d="M 710 155 L 710 185 L 120 185 L 120 220" fill="none" stroke="#198038" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Target Pool Cards -->
  <!-- Pool 4: /gpu -->
  <g transform="translate(30, 225)">
    <rect x="0" y="0" width="180" height="145" rx="6" fill="#f4fbf5" stroke="#198038" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#198038"/>
    <rect x="0" y="14" width="180" height="10" fill="#198038"/>
    <text x="90" y="16" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">/gpu/v1/completions</text>
    <text x="12" y="44" font-size="11" font-weight="700" fill="#198038">Homogeneous GPU</text>
    <text x="12" y="62" font-size="10" fill="#161616">• Node: p1-gpu-worker-1</text>
    <text x="12" y="78" font-size="10" fill="#161616">• 1x NVIDIA A100 GPU</text>
    <text x="12" y="94" font-size="10" fill="#161616">• Standalone Base</text>
    <text x="12" y="112" font-size="10" fill="#525252">• Baseline Reference</text>
    <text x="12" y="130" font-size="9.5" fill="#198038" font-weight="600">• Rate: ~80 tok/s</text>
  </g>

  <!-- Pool 1: /tp1 -->
  <g transform="translate(250, 225)">
    <rect x="0" y="0" width="180" height="145" rx="6" fill="#f2f9f7" stroke="#007d79" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#007d79"/>
    <rect x="0" y="14" width="180" height="10" fill="#007d79"/>
    <text x="90" y="16" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">/tp1/v1/completions</text>
    <text x="12" y="44" font-size="11" font-weight="700" fill="#005d5d">Spyre TP=1 Disagg</text>
    <text x="12" y="62" font-size="10" fill="#161616">• Node: p1-worker-63</text>
    <text x="12" y="78" font-size="10" fill="#161616">• 1P (TP=1) + 1D (TP=1)</text>
    <text x="12" y="94" font-size="10" fill="#161616">• Same-node CMA</text>
    <text x="12" y="112" font-size="10" fill="#525252">• NIXL 80-region layout</text>
    <text x="12" y="130" font-size="9.5" fill="#007d79" font-weight="600">• TTFT: ~210 ms</text>
  </g>

  <!-- Pool 2: /v1 -->
  <g transform="translate(470, 225)">
    <rect x="0" y="0" width="180" height="145" rx="6" fill="#f0f5ff" stroke="#0f62fe" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#0f62fe"/>
    <rect x="0" y="14" width="180" height="10" fill="#0f62fe"/>
    <text x="90" y="16" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">/v1/completions</text>
    <text x="12" y="44" font-size="11" font-weight="700" fill="#0043ce">Spyre TP=2 Disagg</text>
    <text x="12" y="62" font-size="10" fill="#161616">• Node: p1-worker-69</text>
    <text x="12" y="78" font-size="10" fill="#161616">• 1P (TP=1) + 1D (TP=2)</text>
    <text x="12" y="94" font-size="10" fill="#161616">• TP Head Splitting</text>
    <text x="12" y="112" font-size="10" fill="#525252">• 4 KV heads / card</text>
    <text x="12" y="130" font-size="9.5" fill="#0f62fe" font-weight="600">• Higher Batch Capacity</text>
  </g>

  <!-- Pool 3: /hybrid -->
  <g transform="translate(690, 225)">
    <rect x="0" y="0" width="200" height="145" rx="6" fill="#f8f4ff" stroke="#8a3ffc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="24" rx="6" fill="#8a3ffc"/>
    <rect x="0" y="14" width="200" height="10" fill="#8a3ffc"/>
    <text x="100" y="16" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">/hybrid/v1/completions</text>
    <text x="12" y="44" font-size="11" font-weight="700" fill="#6929c4">Heterogeneous Hybrid</text>
    <text x="12" y="62" font-size="10" fill="#161616">• 1P/2P/4P Spyre AIU (Node 63)</text>
    <text x="12" y="78" font-size="10" fill="#161616">• 1D NVIDIA A100 (GPU-1)</text>
    <text x="12" y="94" font-size="10" fill="#161616">• Cross-node UCX TCP</text>
    <text x="12" y="112" font-size="10" fill="#525252">• Packed HND Staging</text>
    <text x="12" y="130" font-size="9.5" fill="#8a3ffc" font-weight="600">• Peak Rate: ~320 tok/s</text>
  </g>
</svg>
