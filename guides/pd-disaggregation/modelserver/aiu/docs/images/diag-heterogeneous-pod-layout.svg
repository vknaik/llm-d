<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%" style="background:#ffffff;font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="aiuNodeGrad" x1="0" y1="0" x2="0" y2="1">
      <feStop offset="0%" stop-color="#f2f9f7"/>
      <feStop offset="100%" stop-color="#e4f3ef"/>
    </linearGradient>
    <linearGradient id="gpuNodeGrad" x1="0" y1="0" x2="0" y2="1">
      <feStop offset="0%" stop-color="#f5f8fc"/>
      <feStop offset="100%" stop-color="#e5eefc"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#198038"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f62fe"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8a3ffc"/>
    </marker>
  </defs>

  <!-- Title & Environment Banner -->
  <text x="30" y="32" font-size="18" font-weight="700" fill="#161616">Heterogeneous Hybrid Prefill-Decode Disaggregation (Spyre AIU → NVIDIA A100 GPU)</text>
  <text x="30" y="52" font-size="12" fill="#525252">Topology: OpenShift Cluster llm-d.spyre | Namespace: llm-d-on-gpu | Model: granite-8b (bfloat16, GQA 8 KV heads)</text>

  <!-- PREFILL TIER NODE -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="460" height="400" rx="10" fill="url(#aiuNodeGrad)" stroke="#a7e6d7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="460" height="34" rx="10" fill="#005d5d"/>
    <rect x="0" y="20" width="460" height="14" fill="#005d5d"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#ffffff">Prefill Tier: Node p1-worker-63 (IBM Spyre AIU Cluster)</text>

    <!-- Subtitle info -->
    <rect x="15" y="44" width="430" height="24" rx="4" fill="#eaf6f4" stroke="#6fdc8c" stroke-width="0.8"/>
    <text x="24" y="60" font-size="11" font-weight="600" fill="#004d4a">Scaled Prefill Workers (1P, 2P, or 4P Replicas) — 75W TDP per Card</text>

    <!-- Prefill Pod P1 -->
    <g transform="translate(15, 78)">
      <rect x="0" y="0" width="430" height="140" rx="6" fill="#ffffff" stroke="#007d79" stroke-width="1.2" filter="url(#shadow)"/>
      <rect x="0" y="0" width="430" height="24" rx="6" fill="#cbf4e8"/>
      <rect x="0" y="14" width="430" height="10" fill="#cbf4e8"/>
      <text x="12" y="16" font-size="12" font-weight="700" fill="#004d4a">Pod: pd-disagg-hybrid-spyre-prefill-P1</text>
      <text x="310" y="16" font-size="11" fill="#005d5d">IP: 10.130.2.55</text>

      <text x="14" y="42" font-size="11" fill="#161616">• Hardware: <tspan font-weight="600" fill="#007d79">PCIe Card 2f:00.0</tspan> (IBM Spyre AIU, TP=1)</text>
      <text x="14" y="60" font-size="11" fill="#161616">• Stack: vLLM 0.28.0 + Spyre Plugin + SENDNN</text>
      <text x="14" y="78" font-size="11" fill="#161616">• Ingress: Port 8000 | NIXL Side-Channel: <tspan font-weight="600">Port 5600</tspan></text>
      <text x="14" y="96" font-size="11" fill="#161616">• Staging: <tspan font-weight="600" fill="#007d79">save_kv_to_host()</tspan> → Pinned CPU Host DRAM</text>
      <text x="14" y="114" font-size="11" fill="#161616">• Staging Tensor: <tspan font-family="monospace" font-size="10.5">torch.bfloat16 (num_blocks, 8, 64, 128)</tspan></text>
      <text x="14" y="130" font-size="10.5" fill="#525252">• Prefill Speed: TTFT = 210 ms (ISL=16) / 1.42 s (ISL=200)</text>
    </g>

    <!-- Prefill Pod P2 -->
    <g transform="translate(15, 230)">
      <rect x="0" y="0" width="430" height="140" rx="6" fill="#ffffff" stroke="#007d79" stroke-width="1.2" filter="url(#shadow)"/>
      <rect x="0" y="0" width="430" height="24" rx="6" fill="#cbf4e8"/>
      <rect x="0" y="14" width="430" height="10" fill="#cbf4e8"/>
      <text x="12" y="16" font-size="12" font-weight="700" fill="#004d4a">Pod: pd-disagg-hybrid-spyre-prefill-P2 (to P4)</text>
      <text x="310" y="16" font-size="11" fill="#005d5d">IP: 10.130.2.72</text>

      <text x="14" y="42" font-size="11" fill="#161616">• Hardware: <tspan font-weight="600" fill="#007d79">PCIe Card 30:00.0</tspan> (IBM Spyre AIU, TP=1)</text>
      <text x="14" y="60" font-size="11" fill="#161616">• Stack: vLLM 0.28.0 + Spyre Plugin + SENDNN</text>
      <text x="14" y="78" font-size="11" fill="#161616">• Ingress: Port 8000 | NIXL Side-Channel: <tspan font-weight="600">Port 5600</tspan></text>
      <text x="14" y="96" font-size="11" fill="#161616">• Staging: Pinned Host DRAM via <tspan font-weight="600">SpyreNixlConnector</tspan></text>
      <text x="14" y="114" font-size="11" fill="#161616">• Mode: <tspan font-weight="600" fill="#0f62fe">SPYRE_NIXL_PACKED_KV=1</tspan> (Cross-Architecture)</text>
      <text x="14" y="130" font-size="10.5" fill="#525252">• Load Balanced via Endpoint Picker (EPP) Scoring</text>
    </g>
  </g>

  <!-- DECODE TIER NODE -->
  <g transform="translate(530, 70)">
    <rect x="0" y="0" width="460" height="400" rx="10" fill="url(#gpuNodeGrad)" stroke="#a6c8ff" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="460" height="34" rx="10" fill="#0f62fe"/>
    <rect x="0" y="20" width="460" height="14" fill="#0f62fe"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#ffffff">Decode Tier: Node p1-gpu-worker-1 (NVIDIA A100 GPU)</text>

    <!-- Subtitle info -->
    <rect x="15" y="44" width="430" height="24" rx="4" fill="#edf5ff" stroke="#78a9ff" stroke-width="0.8"/>
    <text x="24" y="60" font-size="11" font-weight="600" fill="#0043ce">High-Bandwidth Decode Engine (1,935 GB/s HBM2e VRAM)</text>

    <!-- Decode Pod -->
    <g transform="translate(15, 78)">
      <rect x="0" y="0" width="430" height="302" rx="6" fill="#ffffff" stroke="#0043ce" stroke-width="1.2" filter="url(#shadow)"/>
      <rect x="0" y="0" width="430" height="24" rx="6" fill="#d0e2ff"/>
      <rect x="0" y="14" width="430" height="10" fill="#d0e2ff"/>
      <text x="12" y="16" font-size="12" font-weight="700" fill="#002d9c">Pod: pd-disagg-hybrid-nvidia-gpu-decode</text>
      <text x="310" y="16" font-size="11" fill="#0043ce">IP: 10.128.4.127</text>

      <!-- Container: routing-proxy -->
      <g transform="translate(12, 34)">
        <rect x="0" y="0" width="406" height="92" rx="5" fill="#f8fafd" stroke="#78a9ff" stroke-width="1"/>
        <rect x="0" y="0" width="406" height="20" rx="5" fill="#edf5ff"/>
        <rect x="0" y="10" width="406" height="10" fill="#edf5ff"/>
        <text x="10" y="14" font-size="11" font-weight="700" fill="#0043ce">Container: routing-proxy (Port: 8000)</text>
        
        <text x="10" y="34" font-size="10.5" fill="#161616">• Receives Client traffic via Istio Gateway &amp; EPP route</text>
        <text x="10" y="50" font-size="10.5" fill="#161616">• Injects <tspan font-weight="600">x-prefiller-host-port</tspan> header</text>
        <text x="10" y="66" font-size="10.5" fill="#161616">• Dispatches Phase 1 to P1/P2/P4; receives metadata</text>
        <text x="10" y="82" font-size="10.5" fill="#161616">• Forwards Phase 2 with KV descriptors to local :8001</text>
      </g>

      <!-- Container: modelserver (GPU Decode) -->
      <g transform="translate(12, 136)">
        <rect x="0" y="0" width="406" height="152" rx="5" fill="#f8fafd" stroke="#002d9c" stroke-width="1.2"/>
        <rect x="0" y="0" width="406" height="20" rx="5" fill="#d0e2ff"/>
        <rect x="0" y="10" width="406" height="10" fill="#d0e2ff"/>
        <text x="10" y="14" font-size="11" font-weight="700" fill="#002d9c">Container: modelserver (Port: 8001, CUDA Engine)</text>
        
        <text x="10" y="34" font-size="10.5" fill="#161616">• Hardware: <tspan font-weight="700" fill="#0043ce">1x NVIDIA A100-PCIE-80GB GPU</tspan> (TP=1)</text>
        <text x="10" y="50" font-size="10.5" fill="#161616">• Stack: vLLM 0.28.0 (CUDA) + PagedAttention + NIXL</text>
        <text x="10" y="66" font-size="10.5" fill="#161616">• Arguments: <tspan font-family="monospace" font-size="10">--block-size=64 --kv-connector NixlConnector</tspan></text>
        <text x="10" y="82" font-size="10.5" fill="#161616">• Compatibility: <tspan font-weight="600" fill="#8a3ffc">enforce_handshake_compat: false</tspan></text>
        <text x="10" y="98" font-size="10.5" fill="#161616">• NIXL READ: Pulls remote AIU KV blocks over UCX TCP</text>
        <text x="10" y="114" font-size="10.5" fill="#161616">• Ingestion: Copies Staging Host DRAM → A100 VRAM</text>
        <text x="10" y="130" font-size="10.5" fill="#161616">• Decode Throughput: <tspan font-weight="700" fill="#198038">~80 tok/s per stream</tspan> (12.5 ms ITL)</text>
        <text x="10" y="144" font-size="10" fill="#525252">• Aggregate System Rate: ~320 tok/s at 4P-1D concurrency</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM INTERCONNECT BAR -->
  <g transform="translate(30, 480)">
    <rect x="0" y="0" width="960" height="48" rx="6" fill="#f4f4f4" stroke="#8a3ffc" stroke-width="1.5" filter="url(#shadow)"/>
    <path d="M 230 -10 L 230 15 L 760 15 L 760 -10" fill="none" stroke="#8a3ffc" stroke-width="2.5" stroke-dasharray="5,3"/>
    
    <text x="480" y="24" font-size="12" font-weight="700" fill="#6929c4" text-anchor="middle">Cross-Node UCX TCP Interconnect (OpenShift 100 GbE RoCE / TCP Network)</text>
    <text x="480" y="40" font-size="10.5" fill="#393939" text-anchor="middle">Flow: D2H (Spyre AIU DRAM) ➔ CPU Host Staging ➔ UCX TCP (5600) ➔ H2D (NVIDIA A100 GPU VRAM)</text>
  </g>
</svg>
