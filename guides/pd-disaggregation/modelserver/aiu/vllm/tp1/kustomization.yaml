apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/pd/vllm
  - spyre-precompiled-model-tp1-pvc.yaml

namePrefix: pd-disagg-tp1-ibm-aiu-vllm-

components:
  - ../../../../../recipes/modelserver/components/images/aiu-vllm

labels:
  - pairs:
      llm-d.ai/model: granite-4.2-8b
      llm-d.ai/guide: pd-disaggregation-tp1
      llm-d.ai/accelerator-variant: aiu
      llm-d.ai/accelerator-vendor: ibm
      llm-d.ai/engine-type: vllm
      llm-d.ai/tp: "1"
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-decode-aiu-tp1.yaml
  - path: patch-prefill-aiu-tp1.yaml
  - path: patch-decode-routing-sidecar.yaml
  - path: patch-decode-ports.yaml
