apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  strategy:
    type: Recreate
    rollingUpdate: null
  replicas: 1
  template:
    spec:
      schedulerName: spyre-scheduler
      nodeSelector:
        ibm.com/spyre.product: IBM_Spyre
        kubernetes.io/hostname: p1-worker-63
      initContainers:
        - name: preprocess
          image: ghcr.io/llm-d/llm-d-benchmark:v0.6.8.1
          imagePullPolicy: Always
          command:
            - set_llmdbench_environment.py
            - -e
            - /shared-config/llmdbench_env.sh
            - -i
          env:
            - name: HOME
              value: /home/vllm
            - name: XDG_CACHE_HOME
              value: /home/vllm/.cache
            - name: XDG_CONFIG_HOME
              value: /home/vllm/.config
          volumeMounts:
            - name: shared-config
              mountPath: /shared-config
            - name: preprocess-home
              mountPath: /home/vllm
      containers:
        - name: modelserver
          command:
            - /bin/bash
            - -lc
          args:
            - |
              . /etc/bashrc-sentient-env.sh
              source /home/senuser/spyre-inference/.venv/bin/activate
              vllm serve /model-cache/$MODEL_PATH \
                --host 0.0.0.0 \
                --served-model-name $MODEL_NAME \
                --port $VLLM_BACKEND_PORT \
                --block-size $VLLM_BLOCK_SIZE \
                --max-model-len $VLLM_MAX_MODEL_LEN \
                --max-num-seqs $VLLM_MAX_NUM_SEQ \
                --max-num-batched-tokens $VLLM_MAX_NUM_BATCHED_TOKENS \
                --tensor-parallel-size $TP_SIZE \
                --kv-transfer-config '{"kv_connector":"SpyreNixlConnector","kv_role":"kv_consumer"}' \
                --disable-uvicorn-access-log \
                --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                --enable-prefix-caching \
                --dtype bfloat16 \
                --no-disable-hybrid-kv-cache-manager
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_PLUGINS
              value: spyre_inference
            - name: MODEL_PATH
              value: models/ibm-granite/granite-4.2-8b
            - name: MODEL_NAME
              value: granite-8b
            - name: VLLM_BACKEND_PORT
              value: "8001"
            - name: VLLM_BLOCK_SIZE
              value: "64"
            - name: VLLM_MAX_MODEL_LEN
              value: "8192"
            - name: VLLM_MAX_NUM_SEQ
              value: "16"
            - name: VLLM_MAX_NUM_BATCHED_TOKENS
              value: "4096"
            - name: TP_SIZE
              value: "1"
            - name: HOME
              value: /tmp
            - name: USER
              value: vllm
            - name: LOGNAME
              value: vllm
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /mnt/spyre-precompiled-model-tp1
            - name: TRITON_CACHE_DIR
              value: /.triton
            - name: XDG_CACHE_HOME
              value: /.cache
            - name: XDG_CONFIG_HOME
              value: /.config
            - name: FLEX_COMPUTE
              value: SENTIENT
            - name: FLEX_DEVICE
              value: PF
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: TORCH_SENDNN_CACHE_ENABLE
              value: "1"
            - name: TORCH_SENDNN_CACHE_DIR
              value: /mnt/spyre-precompiled-model-tp1
            - name: VLLM_SPYRE_ENABLE_NIXL_TRANSFER
              value: "1"
            - name: VLLM_SPYRE_NIXL_BLOCKING_TRANSFER
              value: "0"
            - name: VLLM_SPYRE_ENABLE_KV_CONNECTOR_BRIDGE
              value: "1"
            - name: UCX_TLS
              value: "cma,sysv,posix,tcp,self"
            - name: UCX_ZCOPY_THRESH
              value: "1"
            - name: HF_HOME
              value: /models/huggingface_cache
          resources:
            limits:
              cpu: "20"
              memory: 140Gi
              ibm.com/spyre_pf: "1"
            requests:
              cpu: "20"
              memory: 140Gi
              ibm.com/spyre_pf: "1"
          securityContext:
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_RAWIO"
                - "NET_ADMIN"
                - "NET_RAW"
            runAsGroup: 0
            runAsUser: 0
          imagePullPolicy: Always
          volumeMounts:
            - mountPath: /shared-config
              name: shared-config
            - mountPath: /model-cache
              name: model-cache
            - mountPath: /mnt/spyre-precompiled-model-tp1
              name: spyre-precompiled-model-tp1
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.config
              name: vllm-config
            - mountPath: /.triton
              name: triton-cache
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            # TP=1: ~900s cold warmup + buffer. 120 x 30s = 60 min window.
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: shared-config
          emptyDir: {}
        - name: preprocess-home
          emptyDir: {}
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-pvc
        - name: spyre-precompiled-model-tp1
          persistentVolumeClaim:
            claimName: pd-disagg-tp1-ibm-aiu-vllm-spyre-precompiled-model-tp1
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: torch-compile-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
