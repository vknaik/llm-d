apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 1
  template:
    spec:
      schedulerName: spyre-scheduler
      nodeSelector:
        ibm.com/spyre.product: IBM_Spyre
        kubernetes.io/hostname: p1-worker-69
      initContainers:
        - name: preprocess
          image: ghcr.io/llm-d/llm-d-benchmark:v0.6.8.1
          imagePullPolicy: Always
          command:
            - set_llmdbench_environment.py
            - -e
            - /shared-config/llmdbench_env.sh
            - -i
          env:
            - name: HOME
              value: /home/vllm
            - name: XDG_CACHE_HOME
              value: /home/vllm/.cache
            - name: XDG_CONFIG_HOME
              value: /home/vllm/.config
          volumeMounts:
            - name: shared-config
              mountPath: /shared-config
            - name: preprocess-home
              mountPath: /home/vllm
      containers:
        - name: modelserver
          command:
            - /bin/bash
            - -lc
          args:
            - |
              . /etc/bashrc-sentient-env.sh
              setup_multi_aiu_env
              source /home/senuser/spyre-inference/.venv/bin/activate
              # Copy patched files from shared volume
              cp /share/test2-prefill/workspace/files-modified/base_worker.py \
                 /home/senuser/spyre-inference/.venv/lib64/python3.12/site-packages/vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py
              cp /share/test2-prefill/workspace/files-modified/utils.py \
                 /home/senuser/spyre-inference/.venv/lib64/python3.12/site-packages/vllm/distributed/kv_transfer/kv_connector/utils.py
              vllm serve /model-cache/$MODEL_PATH \
                --host 0.0.0.0 \
                --served-model-name $MODEL_NAME \
                --port $VLLM_BACKEND_PORT \
                --block-size $VLLM_BLOCK_SIZE \
                --max-model-len $VLLM_MAX_MODEL_LEN \
                --max-num-seqs $VLLM_MAX_NUM_SEQ \
                --max-num-batched-tokens $VLLM_MAX_NUM_BATCHED_TOKENS \
                --tensor-parallel-size $TP_SIZE \
                --kv-transfer-config '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}' \
                --disable-uvicorn-access-log \
                --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                --enable-prefix-caching \
                --dtype bfloat16 \
                --no-disable-hybrid-kv-cache-manager
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_PLUGINS
              value: spyre_inference
            - name: AIU_SETUP_MULTI_AIU
              value: "1"
            - name: MODEL_PATH
              value: models/ibm-granite/granite-3.3-8b-instruct
            - name: MODEL_NAME
              value: granite-8b
            - name: VLLM_BACKEND_PORT
              value: "8001"
            - name: VLLM_BLOCK_SIZE
              value: "64"
            - name: VLLM_MAX_MODEL_LEN
              value: "16384"
            - name: VLLM_MAX_NUM_SEQ
              value: "32"
            - name: VLLM_MAX_NUM_BATCHED_TOKENS
              value: "4096"
            - name: TP_SIZE
              value: "2"
            - name: HOME
              value: /tmp
            - name: USER
              value: vllm
            - name: LOGNAME
              value: vllm
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /mnt/spyre-precompiled-model
            - name: TRITON_CACHE_DIR
              value: /.triton
            - name: XDG_CACHE_HOME
              value: /.cache
            - name: XDG_CONFIG_HOME
              value: /.config
            - name: FLEX_COMPUTE
              value: SENTIENT
            - name: FLEX_DEVICE
              value: PF
            - name: VLLM_SPYRE_PERF_METRIC_LOGGING_ENABLED
              value: "1"
            - name: FLEX_HDMA_P2PSIZE
              value: "268435456"
            - name: FLEX_HDMA_COLLSIZE
              value: "268435456"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: TORCH_SENDNN_CACHE_ENABLE
              value: "1"
            - name: TORCH_SENDNN_CACHE_DIR
              value: /mnt/spyre-precompiled-model
            - name: VLLM_SPYRE_DYNAMO_BACKEND
              value: sendnn
            - name: VLLM_SPYRE_USE_CB
              value: "1"
            - name: VLLM_SPYRE_USE_CHUNKED_PREFILL
              value: "1"
            - name: VLLM_DT_CHUNK_LEN
              value: "1024"
            - name: VLLM_SPYRE_ENABLE_NIXL_TRANSFER
              value: "1"
            - name: VLLM_SPYRE_NIXL_BLOCKING_TRANSFER
              value: "0"
            - name: VLLM_SPYRE_ENABLE_KV_CONNECTOR_BRIDGE
              value: "1"
            - name: VLLM_SPYRE_NIXL_REMOTE_IP
              value: "10.131.3.211"
            # Force UCX to prefer CMA/SHM transports over TCP for same-node transfers.
            # CMA (process_vm_readv) is confirmed available between co-located pods
            # (ptrace_scope=0, shared host PID namespace). This avoids the TCP
            # prep_xfer_dlist deadlock caused by 655K-descriptor 15MB payloads.
            - name: UCX_TLS
              value: "cma,sysv,posix,tcp,self"
            - name: UCX_ZCOPY_THRESH
              value: "1"
            - name: HF_HOME
              value: /models/huggingface_cache
          resources:
            limits:
              cpu: "20"
              memory: 280Gi
              ibm.com/spyre_pf: "2"
            requests:
              cpu: "20"
              memory: 280Gi
              ibm.com/spyre_pf: "2"
          securityContext:
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_RAWIO"
                - "NET_ADMIN"
                - "NET_RAW"
            runAsGroup: 0
            runAsUser: 0
          imagePullPolicy: Always
          volumeMounts:
            - mountPath: /shared-config
              name: shared-config
            - mountPath: /model-cache
              name: model-cache
            - mountPath: /mnt/spyre-precompiled-model
              name: spyre-precompiled-model
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.config
              name: vllm-config
            - mountPath: /.triton
              name: triton-cache
            - mountPath: /share
              name: share
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            # 5759 x 30s = 172770s ~ 48h window. Phase B TP=2 graph compilation takes >12h.
            # PVC accumulates init_binary.bin across container restarts.
            # 48h ensures even a fresh-PVC first-time compile always completes in one run.
            failureThreshold: 5759
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: shared-config
          emptyDir: {}
        - name: preprocess-home
          emptyDir: {}
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-pvc
          # claimName: workload-pvc
        - name: spyre-precompiled-model
          persistentVolumeClaim:
            claimName: spyre-precompiled-model
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: torch-compile-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
        - name: share
          persistentVolumeClaim:
            claimName: llm-d-vllm-spyre
