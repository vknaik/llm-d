apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill
spec:
  replicas: 1
  template:
    spec:
      schedulerName: spyre-scheduler
      nodeSelector:
        ibm.com/spyre.product: IBM_Spyre
        kubernetes.io/hostname: p1-worker-69
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            - "ibm-granite/granite-3.3-8b-instruct"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size=1"
            - "--block-size=128"
            - "--kv-transfer-config"
            - '{"kv_connector":"NixlConnector", "kv_role":"kv_producer"}'
            - "--no-disable-hybrid-kv-cache-manager"
            - "--gpu-memory-utilization=0.95"
            - "--max-model-len=32768"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOME
              value: /tmp
            - name: USER
              value: vllm
            - name: LOGNAME
              value: vllm
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /.cache/torchinductor
            - name: TRITON_CACHE_DIR
              value: /.triton
            - name: XDG_CACHE_HOME
              value: /.cache
            - name: XDG_CONFIG_HOME
              value: /.config
            # NOTE: vLLM 0.19.X and 0.20.X images ship both nixl-cu13 and nixl-cu12;
            # NIXL can pick the wrong UCX libraries. Uncomment UCX_MODULE_DIR only
            # if you are running a cu129 version of vLLM.
            # - name: UCX_MODULE_DIR
            #   value: /usr/local/lib/python3.12/dist-packages/nixl_cu12.libs/ucx
            # Default vLLM keep-alive (5s) is shorter than llm-d-routing-sidecar's default idle
            # conn timeout (90s, from Go http.Transport), causing TCP RSTs on reuse.
            # Server keep-alive must be >= sidecar idle timeout; configured to 120s.
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "120"
          resources:
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.config
              name: vllm-config
            - mountPath: /.triton
              name: triton-cache
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: torch-compile-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
